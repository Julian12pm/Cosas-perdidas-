name: objetos-perdidos-itm

# Local stack: Postgres 16 (stock image, no pg_cron) plus the API.
# Compose reads .env from this directory; the API also accepts api/.env.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-objetos_perdidos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-objetos_perdidos}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: node:24-alpine
    working_dir: /app
    # Migrations run first; the server only starts once they succeed.
    command:
      - sh
      - -c
      - corepack enable && pnpm install --frozen-lockfile --store-dir /pnpm/store && node api/src/db/migrate.ts && node api/src/server.ts
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/objetos_perdidos}
      PORT: ${PORT:-3001}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-3001}:3001'
    volumes:
      - .:/app
      # Keeps the install inside the container instead of the host checkout.
      - api_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store

volumes:
  pgdata:
  api_node_modules:
  pnpm_store:
